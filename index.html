    function updateDailyStreak() {

        const last = new Date(state.lastVisitDate);
        const now = new Date(today);
        const diffDays = Math.round((now - last) / (1000 * 60 * 60 * 24));
        if (diffDays === 1) {
          state.streak += 1;
        } else if (diffDays > 1) {
          state.streak = 1;
        }
        state.lastVisitDate = today;
        saveState();
      }
    }

    // Допоміжна функція перекладу частих помилок Python на зрозумілу українську мову
    function getFriendlyErrorHint(errorText) {
      if (errorText.includes("IndentationError")) {
        return "💡 Підказка ментора: Помилка відступів (IndentationError). У Python після двокрапки (:) потрібно ставити рівно 4 пробіли!";

      if (errorText.includes("SyntaxError")) {
        return "💡 Підказка ментора: Синтаксична помилка (SyntaxError). Перевір, чи не забув ти закрити лапки, дужки або поставити двокрапку : в кінці рядка з if/for/def.";
      }
      if (errorText.includes("NameError")) {
        return "💡 Підказка ментора: Невідоме ім'я (NameError). Можливо, ти зробив одруківку в назві змінної або забув взяти текст у лапки \"...\".";
      }
      if (errorText.includes("TypeError")) {
        return "💡 Підказка ментора: Помилка типів (TypeError). Ти намагаєшся поєднати несумісні типи (наприклад, додати число до рядка без str() або int()).";
      }
      if (errorText.includes("ZeroDivisionError")) {
        return "💡 Підказка ментора: Ділення на нуль! Перевір дільник у своїй формулі.";
      }
      if (errorText.includes("IndexError")) {
        return "💡 Підказка ментора: Вихід за межі списку (IndexError). Пам'ятай, що індексація починається з 0, а останній елемент має індекс len(list) - 1.";
      }
      if (errorText.includes("KeyError")) {
        return "💡 Підказка ментора: Такого ключа немає у словнику (KeyError). Спробуй використати безпечний метод .get('ключ').";
      }
      if (errorText.includes("AssertionError")) {
        return "💡 Перевірка тесту не пройдена — порівняй свій вивід та змінні з умовою задачі.";
      }
      return "";
    }

__stderr_buf = io.StringIO()
__old_stdout = sys.stdout

def __mock_input(prompt=""):

(__stdout_buf.getvalue(), __exec_error)

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Легкий токенізатор для підсвічування прикладів Python у теорії
    function highlightPython(code) {
      const escaped = escapeHtml(code);
      const tokenRegex = /(#.*$)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(def|class|return|if|elif|else|for|while|in|not|and|or|True|False|None|break|continue|pass|import|from|as|try|except|finally|with|is|lambda)\b|\b(print|len|range|int|float|str|bool|list|dict|type|id|round|sum|max|min|any|all|super|input)\b|\b(\d+(?:\.\d+)?)\b/gm;

      return escaped.replace(tokenRegex, (match, comment, str, kw, bi, num) => {
        if (comment) return `<span class="py-com">${comment}</span>`;
        if (str) return `<span class="py-str">${str}</span>`;
        if (kw) return `<span class="py-kw">${kw}</span>`;
        if (bi) return `<span class="py-bi">${bi}</span>`;
        if (num) return `<span class="py-num">${num}</span>`;
        return match;
      });
    }

    // Копіювання тексту в буфер обміну без використання clipboard API (безпечно для iframe)
    function copyTextSafe(text, label = "Текст скопійовано!") {
      const tempArea = document.createElement("textarea");
      tempArea.value = text;
      tempArea.style.position = "fixed";
      tempArea.style.left = "-9999px";
      document.body.appendChild(tempArea);
      tempArea.select();
      try {
        document.execCommand("copy");
        showToast(label, "info");
      } catch (e) {
        showToast("Не вдалося скопіювати текст", "error");
      }
      document.body.removeChild(tempArea);
    }

    // Красиві неблокуючі сповіщення (замість alert)
    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");

      const styles = {
        success: "bg-[#111827] border-emerald-500/50 text-emerald-200 shadow-emerald-500/15",
        info: "bg-[#111827] border-indigo-500/50 text-indigo-200 shadow-indigo-500/15",
        error: "bg-[#111827] border-rose-500/50 text-rose-200 shadow-rose-500/15"
      };
      const icons = { success: "🎉", info: "📋", error: "⚠️" };

      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border shadow-xl text-sm font-medium animate-fade-in ${styles[type] || styles.info}`;
      toast.innerHTML = `<span class="text-base shrink-0">${icons[type] || "✨"}</span><span>${escapeHtml(message)}</span>`;

      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(6px)";
        toast.style.transition = "all 0.25s ease";
        setTimeout(() => toast.remove(), 260);
      }, 3200);
    }

    // =========================================================================
    // 6. ОНОВЛЕННЯ ХЕДЕРА ТА БОКОВОГО МЕНЮ
    // =========================================================================
    function updateGlobalHUD() {
      const lvl = getLevelInfo(state.xp);
      const pctInLevel = Math.min(100, Math.round(((state.xp - lvl.prevXp) / (lvl.nextXp - lvl.prevXp)) * 100));
      const totalCoursePct = getTotalCourseProgress();

      // Хедер
      document.getElementById("topbar-streak").textContent = `${state.streak} дн.`;
      document.getElementById("topbar-level").textContent = lvl.title;
      document.getElementById("topbar-xp").textContent = `${state.xp} XP`;
      document.getElementById("topbar-xp-bar").style.width = `${pctInLevel}%`;
      document.getElementById("topbar-goal-text").textContent = state.goal || "Натисни, щоб задати свою головну ціль...";

      // Сайдбар прогрес
      document.getElementById("sidebar-rank-badge").textContent = lvl.title;
      document.getElementById("sidebar-xp-bar").style.width = `${Math.min(100, Math.round((state.xp / 1400) * 100))}%`;
      document.getElementById("sidebar-xp-text").textContent = `${state.xp} XP`;
      document.getElementById("sidebar-total-pct").textContent = `${totalCoursePct}%`;

      // Активний пункт меню Дашборд
      const dashBtn = document.getElementById("nav-dashboard");
      if (state.activeView === "dashboard") {
        dashBtn.className = "w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-semibold transition bg-indigo-500/15 text-indigo-300 border border-indigo-500/30";
      } else {
        dashBtn.className = "w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-800/70 border border-transparent";
      }

      // Список 7 модулів у сайдбарі
      const listEl = document.getElementById("modules-nav-list");
      listEl.innerHTML = MODULES_DATA.map(mod => {
        const isActive = state.activeView === `module_${mod.id}`;
        const pct = getModuleProgress(mod);
        const isDone = pct === 100;

        return `
          <button onclick="navigateTo('module_${mod.id}')"
            class="w-full text-left px-3 py-2.5 rounded-xl transition flex items-center justify-between gap-2 group border ${
              isActive
                ? "bg-emerald-500/12 border-emerald-500/35 text-white"
                : "border-transparent text-slate-400 hover:text-slate-100 hover:bg-slate-800/60"
            }">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="w-6 h-6 rounded-lg text-xs font-mono font-bold flex items-center justify-center shrink-0 ${
                isDone
                  ? "bg-emerald-500 text-slate-950"
                  : isActive
                    ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40"
                    : "bg-slate-800 text-slate-400 group-hover:text-white"
              }">
                ${isDone ? "✓" : mod.id}
              </span>
              <span class="text-xs font-medium truncate">${escapeHtml(mod.shortTitle)}</span>
            </div>
            <span class="text-[10px] font-mono shrink-0 ${isDone ? "text-emerald-400 font-bold" : "text-slate-500"}">
              ${pct}%
            </span>
          </button>
        `;
      }).join("");
    }

    // =========================================================================
    // 7. НАВІГАЦІЯ ТА РЕНДЕР ДАШБОРДУ
    // =========================================================================
    function navigateTo(viewId, tabId = null) {
      state.activeView = viewId;
      if (tabId) {
        state.activeTab = tabId;
      } else if (viewId.startsWith("module_")) {
        state.activeTab = "theory";
      }
      saveState();
      closeMobileSidebar();
      updateGlobalHUD();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderCurrentView() {
      const container = document.getElementById("app-view");
      if (state.activeView === "dashboard") {
        renderDashboard(container);
      } else if (state.activeView.startsWith("module_")) {
        const modId = parseInt(state.activeView.split("_")[1], 10);
        const mod = MODULES_DATA.find(m => m.id === modId) || MODULES_DATA[0];
        renderModuleView(container, mod);
      }
    }

                    </div>
                    <div class="grid grid-cols-4 text-[10px] text-slate-500 font-medium mt-2 text-center">

                const pct = getModuleProgress(mod);

                const projDone = !!state.completedProjects[String(mod.id)];

                return `
                  <div onclick="navigateTo('module_${mod.id}')" class="cursor-pointer group bg-[#111827] hover:bg-[#161F33] border ${isDone ? 'border-emerald-500/40' : 'border-slate-800 hover:border-indigo-500/40'} rounded-2xl p-5 transition-all flex flex-col justify-between gap-4">

                      <div class="flex items-center justify-between gap-2">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-mono font-bold ${isDone ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-indigo-300'}">

    function handleGoalChange(val) {
      state.goal = val;

      document.getElementById("topbar-goal-text").textContent = val || "Натисни, щоб задати свою головну ціль...";
    }

    function focusGoalInput() {
      if (state.activeView !== "dashboard") {
        navigateTo("dashboard");
      }
      setTimeout(() => {
        const inp = document.getElementById("goal-input");
        if (inp) {
          inp.focus();
          inp.select();
        }
      }, 60);
    }

    function nextMentorQuote() {
      state.quoteIndex = (state.quoteIndex + 1) % MENTOR_QUOTES.length;
      saveState();
      const el = document.getElementById("mentor-quote-text");
      if (el) {
        el.style.opacity = "0";
        setTimeout(() => {
          el.textContent = MENTOR_QUOTES[state.quoteIndex];
          el.style.opacity = "1";
          el.style.transition = "opacity 0.25s ease";
        }, 120);
      }
    }

    function continueLearning() {
      const nextMod = MODULES_DATA.find(m => getModuleProgress(m) < 100) || MODULES_DATA[0];
      navigateTo(`module_${nextMod.id}`);
    }

    // =========================================================================
    // 8. РЕНДЕР СТОРІНКИ МОДУЛЯ (5 ІНТЕРАКТИВНИХ ВКЛАДОК)

    function switchModuleTab(tabId) {
      state.activeTab = tabId;
      saveState();
      renderCurrentView();

          label: "🚀 Міні-проєкт",

    function renderNextStepButton(mod, nextMod) {
      const order = ["theory", "micro", "interview", "practice", "project"];

      };
      const idx = order.indexOf(state.activeTab);
      if (idx >= 0 && idx < order.length - 1) {
        const nextTab = order[idx + 1];
        return `
          <button onclick="switchModuleTab('${nextTab}')" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-bold transition shadow-lg shadow-indigo-600/20">

    function renderTabBody(mod, tab) {
      switch (tab) {

          return renderTheoryTab(mod);

    // --- ВКЛАДКА 1: ТЕОРІЯ ПРОСТОЮ МОВОЮ ---

    function handleMicroQuizAnswer(modId, taskId, chosenIndex) {
      const mod = MODULES_DATA.find(m => m.id === modId);
      const task = mod.microTasks[0];
      const fbEl = document.getElementById(`quiz-feedback-${taskId}`);

      if (chosenIndex === task.correctIndex) {
        fbEl.className = "p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-xs sm:text-sm text-emerald-200 leading-relaxed animate-fade-in";
        fbEl.innerHTML = `<strong>Вірно! 🎉</strong> ${escapeHtml(task.explanation)}`;
        if (!state.completedMicro[taskId]) {
          state.completedMicro[taskId] = true;
          awardXP(15, "Мікро-тест пройдено!");
          updateGlobalHUD();
        }
      } else {
        fbEl.className = "p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-xs sm:text-sm text-rose-200 leading-relaxed animate-fade-in";
        fbEl.innerHTML = `<strong>Не зовсім так 🤔</strong> Спробуй ще раз! Згадай принцип роботи, описаний у теорії.`;
      }
    }

    async function runMicroCodeChallenge(modId, taskId) {
      const mod = MODULES_DATA.find(m => m.id === modId);
      const task = mod.microTasks[1];
      const code = document.getElementById(`editor-${taskId}`).value;
      state.savedCode[taskId] = code;
      saveState();

      const consoleBox = document.getElementById(`console-${taskId}`);
      const consoleOut = document.getElementById(`console-out-${taskId}`);
      consoleBox.classList.remove("hidden");
      consoleOut.className = "whitespace-pre-wrap text-slate-400";
      consoleOut.textContent = "Виконання...";

      const res = await executePython(code);
      if (!res.success) {
        consoleOut.className = "whitespace-pre-wrap text-rose-300";
        consoleOut.textContent = res.error;
        return;
      }

      const out = res.output.trim();
      consoleOut.className = "whitespace-pre-wrap text-emerald-300";
      consoleOut.textContent = out || "(Порожній вивід)";

      if (out.includes(task.expectedOutput)) {
        if (!state.completedMicro[taskId]) {
          state.completedMicro[taskId] = true;
          awardXP(20, "Мікро-завдання з коду виконано!");
          renderCurrentView();
        } else {
          showToast("Чудово! Код працює правильно.", "success");
        }
      } else {
        showToast(`Очікувалось у виводі: "${task.expectedOutput}". Перевір код!`, "error");
      }
    }

    async function runPracticeCode(taskId) {
      const code = document.getElementById(`editor-${taskId}`).value;
      state.savedCode[taskId] = code;
      saveState();

      const consoleBox = document.getElementById(`console-${taskId}`);
      const consoleOut = document.getElementById(`console-out-${taskId}`);
      const consoleStatus = document.getElementById(`console-status-${taskId}`);

      consoleBox.classList.remove("hidden");
      consoleStatus.textContent = "Виконання...";
      consoleOut.className = "whitespace-pre-wrap text-slate-400";
      consoleOut.textContent = "Запускаємо код у Pyodide...";

      const res = await executePython(code);
      if (res.success) {
        consoleStatus.innerHTML = `<span class="text-emerald-400">Exit Code: 0</span>`;
        consoleOut.className = "whitespace-pre-wrap text-emerald-300 leading-relaxed";
        consoleOut.textContent = res.output || "(Програма виконалась успішно без текстового виводу)";
      } else {
        consoleStatus.innerHTML = `<span class="text-rose-400">Помилка виконання</span>`;
        consoleOut.className = "whitespace-pre-wrap text-rose-300 leading-relaxed";
        consoleOut.textContent = res.error;
      }
    }

    async function verifyPracticeTask(modId, taskId) {
      const mod = MODULES_DATA.find(m => m.id === modId);
      const task = mod.practice.find(t => t.id === taskId);
      const code = document.getElementById(`editor-${taskId}`).value;
      state.savedCode[taskId] = code;
      saveState();

      const consoleBox = document.getElementById(`console-${taskId}`);
      const consoleOut = document.getElementById(`console-out-${taskId}`);
      const consoleStatus = document.getElementById(`console-status-${taskId}`);

      consoleBox.classList.remove("hidden");
      consoleStatus.textContent = "Тестування...";

      const res = await executePython(code, task.testScript);
      if (res.success) {
        consoleStatus.innerHTML = `<span class="text-emerald-400 font-bold">Усі автотести пройдено ✓</span>`;
        consoleOut.className = "whitespace-pre-wrap text-emerald-300 leading-relaxed";

        if (!state.completedTasks[taskId]) {
          state.completedTasks[taskId] = true;
          awardXP(35, `Задачу "${task.title}" вирішено!`);
          renderCurrentView();
        } else {

        consoleStatus.innerHTML = `<span class="text-rose-400 font-bold">Тест не пройдено ✕</span>`;

        consoleOut.textContent = (res.output ? "Вивід програми:\n" + res.output + "\n\n" : "") + res.error;
      }
    }

                return `
                  <label class="flex items-start gap-2.5 cursor-pointer text-xs sm:text-sm text-slate-200 hover:text-white">
                    <input type="checkbox" ${checked ? "checked" : ""} onchange="toggleProjectSpec('${specId}', this.checked)"
                      class="mt-1 rounded border-slate-600 bg-slate-800 text-emerald-500 focus:ring-emerald-500" />
                    <span class="${checked ? 'line-through text-slate-500' : ''}">${spec}</span>
                  </label>
                `;
              }).join("")}
            </div>

            <!-- Пісочниця проєкту -->
            ${renderCodeEditorWidget(projKey, currentCode, 14)}

            <div class="flex flex-wrap items-center gap-3">
              <button onclick="runProjectCode(${mod.id}, false)" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs sm:text-sm transition border border-slate-700">
                Запустити проєкт ▶
              </button>

              <button onclick="runProjectCode(${mod.id}, true)" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-extrabold text-xs sm:text-sm transition shadow-lg shadow-emerald-500/20">
                Зарахувати проєкт (+60 XP) 🏆
              </button>

              <button onclick='resetProjectStarter(${mod.id})' class="px-3.5 py-2.5 rounded-xl text-xs text-slate-400 hover:text-white transition">
                Відновити шаблон ↺
              </button>
            </div>

            <div id="console-${projKey}" class="hidden bg-[#0B0F19] border border-slate-800 rounded-xl p-4 font-mono text-xs">
              <div class="text-slate-500 mb-1.5">Результат виконання міні-проєкту:</div>
              <pre id="console-out-${projKey}" class="whitespace-pre-wrap text-emerald-300 leading-relaxed"></pre>
            </div>
          </div>
        </div>
      `;
    }

    function toggleProjectSpec(specId, isChecked) {
      state.checkedSpecs[specId] = isChecked;
      saveState();
      renderCurrentView();
    }

    function resetProjectStarter(modId) {
      const mod = MODULES_DATA.find(m => m.id === modId);
      const projKey = `proj_${modId}`;
      state.savedCode[projKey] = mod.project.starterCode;
      saveState();
      renderCurrentView();
      showToast("Стартовий шаблон проєкту відновлено", "info");
    }

    async function runProjectCode(modId, shouldAward) {
      const projKey = `proj_${modId}`;
      const code = document.getElementById(`editor-${projKey}`).value;
      state.savedCode[projKey] = code;
      saveState();

      const consoleBox = document.getElementById(`console-${projKey}`);
      const consoleOut = document.getElementById(`console-out-${projKey}`);
      consoleBox.classList.remove("hidden");
      consoleOut.className = "whitespace-pre-wrap text-slate-400";
      consoleOut.textContent = "Запускаємо проєкт...";

      const res = await executePython(code);
      if (!res.success) {
        consoleOut.className = "whitespace-pre-wrap text-rose-300 leading-relaxed";
        consoleOut.textContent = res.error;
        return;
      }

      consoleOut.className = "whitespace-pre-wrap text-emerald-300 leading-relaxed";
      consoleOut.textContent = res.output || "(Проєкт виконався без текстового виводу)";

      if (shouldAward) {
        if (res.output.trim().length < 5) {
          showToast("Додай вивід результату роботи проєкту через print(), щоб зарахувати!", "error");
          return;
        }
        if (!state.completedProjects[String(modId)]) {
          state.completedProjects[String(modId)] = true;
          awardXP(60, `Міні-проєкт Модуля ${modId} завершено!`);
          renderCurrentView();
        } else {
          showToast("Проєкт вже зараховано! Чудова робота 🚀", "success");
        }
      }
    }

    // =========================================================================
    // 10. ВІДЖЕТ РЕДАКТОРА КОДУ З НУМЕРАЦІЄЮ РЯДКІВ ТА SMART-TAB
    // =========================================================================
    function renderCodeEditorWidget(editorId, initialCode, rows = 8) {
      const lineCount = Math.max(rows, initialCode.split("\n").length);
      const numbersHtml = Array.from({ length: lineCount }, (_, i) => i + 1).join("\n");

      return `
        <div class="bg-[#0B0F19] border border-slate-700/80 focus-within:border-emerald-500/70 rounded-xl overflow-hidden transition">
          <div class="flex items-center justify-between px-3.5 py-2 bg-slate-900 border-b border-slate-800 text-[11px] font-mono text-slate-400">
            <span class="flex items-center gap-2">
              <span class="text-emerald-400 font-bold">Python</span>
              <span>•</span>
              <span>Tab = 4 пробіли</span>
            </span>
            <span class="hidden sm:inline text-slate-500">Автозбереження увімкнено</span>
          </div>
          <div class="flex relative font-mono text-xs sm:text-sm">
            <pre id="gutter-${editorId}" aria-hidden="true" class="select-none py-3.5 px-3 text-right text-slate-600 bg-slate-950/60 border-r border-slate-800/80 leading-relaxed">${numbersHtml}</pre>
            <textarea
              id="editor-${editorId}"
              rows="${rows}"
              spellcheck="false"
              autocapitalize="off"
              autocomplete="off"
              oninput="handleEditorInput('${editorId}')"
              onkeydown="handleEditorKeydown(event, '${editorId}')"
              class="code-textarea flex-1 bg-transparent text-slate-100 p-3.5 leading-relaxed w-full overflow-x-auto"
            >${escapeHtml(initialCode)}</textarea>
          </div>
        </div>
      `;
    }

    function updateEditorLineNumbers(editorId) {
      const textarea = document.getElementById(`editor-${editorId}`);
      const gutter = document.getElementById(`gutter-${editorId}`);
      if (!textarea || !gutter) return;
      const lines = textarea.value.split("\n").length;
      const minRows = parseInt(textarea.getAttribute("rows") || "6", 10);
      const count = Math.max(minRows, lines);
      gutter.textContent = Array.from({ length: count }, (_, i) => i + 1).join("\n");
    }

    function handleEditorInput(editorId) {
      updateEditorLineNumbers(editorId);
      const textarea = document.getElementById(`editor-${editorId}`);
      if (textarea) {
        state.savedCode[editorId] = textarea.value;
        saveState();
      }
    }

    // Підтримка Tab (4 пробіли) та розумного авто-відступу після двокрапки (:)
    function handleEditorKeydown(e, editorId) {
      const textarea = e.target;

      if (e.key === "Tab") {
        e.preventDefault();
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        textarea.value = textarea.value.substring(0, start) + "    " + textarea.value.substring(end);
        textarea.selectionStart = textarea.selectionEnd = start + 4;
        handleEditorInput(editorId);
      } else if (e.key === "Enter") {
        const start = textarea.selectionStart;
        const textBefore = textarea.value.substring(0, start);
        const currentLine = textBefore.split("\n").pop();
        const indentMatch = currentLine.match(/^\s*/);
        let indent = indentMatch ? indentMatch[0] : "";

        // Якщо рядок закінчується двокрапкою (if, for, while, def, class), додаємо +4 пробіли
        if (currentLine.trimEnd().endsWith(":")) {
          indent += "    ";
        }

        if (indent.length > 0) {
          e.preventDefault();
          const end = textarea.selectionEnd;
          textarea.value = textarea.value.substring(0, start) + "\n" + indent + textarea.value.substring(end);
          textarea.selectionStart = textarea.selectionEnd = start + 1 + indent.length;
          handleEditorInput(editorId);
        }
      }
    }

    function toggleHint(elementId) {
      const el = document.getElementById(elementId);
      if (el) {
        el.classList.toggle("hidden");
      }
    }

    // =========================================================================
    // 11. МОБІЛЬНЕ МЕНЮ ТА МОДАЛЬНЕ ВІКНО СКИДАННЯ ПРОГРЕСУ
    // =========================================================================
    const sidebarEl = document.getElementById("sidebar");
    const overlayEl = document.getElementById("mobile-overlay");

    function openMobileSidebar() {
      sidebarEl.classList.remove("-translate-x-full");
      overlayEl.classList.remove("hidden");
    }

    function closeMobileSidebar() {
      sidebarEl.classList.add("-translate-x-full");
      overlayEl.classList.add("hidden");
    }

    document.getElementById("open-sidebar-btn").addEventListener("click", openMobileSidebar);
    document.getElementById("close-sidebar-btn").addEventListener("click", closeMobileSidebar);
    overlayEl.addEventListener("click", closeMobileSidebar);

    const resetModal = document.getElementById("reset-modal");

    function openResetModal() {
      resetModal.classList.remove("hidden");
      resetModal.classList.add("flex");
    }

    function closeResetModal() {
      resetModal.classList.add("hidden");
      resetModal.classList.remove("flex");
    }

    document.getElementById("cancel-reset-btn").addEventListener("click", closeResetModal);
    document.getElementById("confirm-reset-btn").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      state = { ...DEFAULT_STATE };
      saveState();
      closeResetModal();
      updateGlobalHUD();
      renderCurrentView();
      showToast("Прогрес повністю скинуто. Починаємо з чистого аркуша!", "info");
    });

    // =========================================================================
    // 12. ІНІЦІАЛІЗАЦІЯ ДОДАТКУ ПРИ ЗАВАНТАЖЕННІ СТОРІНКИ
    // =========================================================================
    window.addEventListener("DOMContentLoaded", () => {
      updateDailyStreak();
      updateGlobalHUD();
      renderCurrentView();
      initPyodideEngine();
    });
  </script>
</body>
</html>
